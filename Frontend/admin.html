<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>APE3 Seguridad | Administración</title>

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="card wide-card">
        <div class="topbar">
          <div>
            <span class="badge">Panel administrativo</span>
            <h1>Gestión de usuarios</h1>
            <p>
              Solo los usuarios con rol administrador pueden acceder al listado.
            </p>
          </div>

          <div class="actions">
            <a class="btn btn-secondary" href="./dashboard.html">Volver</a>
            <button class="btn btn-danger" id="logoutBtn">Cerrar sesión</button>
          </div>
        </div>

        <div class="grid">
          <section class="panel">
            <h2>Crear usuario</h2>

            <form id="createUserForm" class="form">
              <div class="field">
                <label for="nombre">Nombre</label>
                <input id="nombre" name="nombre" type="text" required />
              </div>

              <div class="field">
                <label for="email">Correo</label>
                <input id="email" name="email" type="email" required />
              </div>

              <div class="field">
                <label for="password">Contraseña</label>
                <input id="password" name="password" type="text" required />
              </div>

              <div class="field">
                <label for="rol">Rol</label>
                <select id="rol" name="rol">
                  <option value="usuario">usuario</option>
                  <option value="admin">admin</option>
                </select>
              </div>

              <button type="submit" class="btn btn-primary">
                Crear usuario
              </button>
            </form>
          </section>

          <section class="panel">
            <div class="section-title">
              <div>
                <h2>Usuarios registrados</h2>
                <p class="muted">Petición: <code>GET /usuarios</code></p>
              </div>

              <button class="btn btn-secondary" id="reloadUsersBtn">
                Recargar
              </button>
            </div>

            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Rol</th>
                    <th>Acciones</th>
                  </tr>
                </thead>
                <tbody id="usersTableBody">
                  <tr>
                    <td colspan="5">Cargando usuarios...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>
        </div>

        <pre id="messageBox" class="message-box hidden"></pre>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
