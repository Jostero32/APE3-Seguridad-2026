version: '3.8'
services:
  backend:
    build:
      context: ./Backend
      dockerfile: DockerFile
    environment:
      DB_NAME: usuarios
      DB_USER: jostero32
      DB_PASS: "1234"
      DB_HOST: db-postgres
      PORT: 3000
    depends_on:
      db-postgres:
        condition: service_healthy
    ports:
      - "8080:3000"

  db-postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: usuarios
      POSTGRES_USER: jostero32
      POSTGRES_PASSWORD: "1234"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5555:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jostero32 -d usuarios"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
